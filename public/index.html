<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawn</title>
<link rel="icon" href="images/favicon.png">
<style>
html, body {
  margin: 0;
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  background-color: black;
  color: hsla(0, 0%, 67%, .99);
  font-family: ui-monospace, Consolas, "Cascadia Mono", Menlo, monospace;
}

header {
  position: relative;
  text-align: center;
  padding: 44px 20px 36px;
  background-image: url(images/dawn_watercolor.png);
  background-size: cover;
  background-position: center 42%;
}

header::after {
  /* keep the wordmark readable over the bright sky */
  content: "";
  position: absolute;
  inset: 0;
  background: hsla(0, 0%, 100%, .18);
}

header h1 {
  position: relative;
  z-index: 1;
  margin: 0;
  font-size: 44px;
  font-weight: normal;
  letter-spacing: 12px;
  text-indent: 12px; /* balance the trailing letter-spacing */
  color: hsla(258, 35%, 18%, .99);
}

header p {
  position: relative;
  z-index: 1;
  margin: 14px 0 0;
  font-size: 14px;
  color: hsla(258, 25%, 30%, .99);
}

nav {
  flex: 1;
  display: flex;
  flex-direction: row;
  min-height: 0;
}

nav a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 28px 16px;
  text-decoration: none;
  color: hsla(0, 0%, 67%, .99);
  border-left: 1px solid hsla(0, 0%, 67%, .25);
  transition: background-color .3s, color .3s;
}

nav a:first-child {
  border-left: none;
}

nav a .cue {
  width: min(320px, 100%);
  aspect-ratio: 16 / 10;
  overflow: hidden;
  border: 1px solid hsla(0, 0%, 67%, .25);
  background: #111111;
}

nav a .cue img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity .3s;
}

nav a:hover .cue img,
nav a:focus-visible .cue img {
  opacity: .82;
}

nav a .number {
  font-size: 13px;
  color: hsla(0, 0%, 45%, .99);
}

nav a .name {
  font-size: 30px;
  letter-spacing: 6px;
  text-indent: 6px;
  color: hsla(0, 0%, 87%, .99);
}

nav a .description {
  font-size: 14px;
  max-width: 30ch;
  text-align: center;
  line-height: 1.6;
  color: hsla(0, 0%, 55%, .99);
}

nav a .arrow {
  font-size: 22px;
  transition: transform .3s;
}

nav a:hover,
nav a:focus-visible {
  background-color: #222222;
  color: hsla(0, 0%, 87%, .99);
  outline: none;
}

nav a:hover .arrow,
nav a:focus-visible .arrow {
  transform: translateX(8px);
}

@media (max-width: 700px) {
  nav {
    flex-direction: column;
    overflow-y: auto;
  }

  nav a {
    border-left: none;
    border-top: 1px solid hsla(0, 0%, 67%, .25);
  }

  nav a:first-child {
    border-top: none;
  }
}
</style>
</head>
<body>
<header>
  <h1>DAWN</h1>
  <p>a flow-based language where everything is a URI</p>
</header>
<nav>
  <a href="tutorial.html">
    <span class="cue"><img src="images/cover.jpg" alt="Phook's (not so poignant) tutorial for Dawn cover"></span>
    <span class="number">1</span>
    <span class="name">TUTORIAL</span>
    <span class="description">Learn the language, chapter by chapter</span>
    <span class="arrow">&#x2192;</span>
  </a>
  <a href="dawn_console.html">
    <span class="cue"><img src="images/console.jpg" alt="The Dawn console" style="object-position: top"></span>
    <span class="number">2</span>
    <span class="name">CONSOLE</span>
    <span class="description">Try Dawn in an interactive terminal</span>
    <span class="arrow">&#x2192;</span>
  </a>
  <a href="editor.html">
    <span class="cue"><img src="images/Ide.jpg" alt="The Dawn IDE" style="object-position: top"></span>
    <span class="number">3</span>
    <span class="name">IDE</span>
    <span class="description">Write, edit and run Dawn programs</span>
    <span class="arrow">&#x2192;</span>
  </a>
</nav>
</body>
</html>
