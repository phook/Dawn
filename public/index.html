<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawn</title>
<link rel="icon" href="images/favicon.png">
<style>
html, body {
  margin: 0;
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  background-color: black;
  color: hsla(0, 0%, 67%, .99);
  font-family: ui-monospace, Consolas, "Cascadia Mono", Menlo, monospace;
}

header {
  text-align: center;
  padding: 34px 20px 26px;
  border-bottom: 1px solid hsla(0, 0%, 67%, .25);
}

header h1 {
  margin: 0;
  font-size: 44px;
  font-weight: normal;
  letter-spacing: 12px;
  text-indent: 12px; /* balance the trailing letter-spacing */
  color: hsla(0, 0%, 87%, .99);
}

header p {
  margin: 14px 0 0;
  font-size: 14px;
  color: hsla(0, 0%, 55%, .99);
}

nav {
  flex: 1;
  display: flex;
  flex-direction: row;
  min-height: 0;
}

nav a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-decoration: none;
  color: hsla(0, 0%, 67%, .99);
  border-left: 1px solid hsla(0, 0%, 67%, .25);
  transition: background-color .3s, color .3s;
}

nav a:first-child {
  border-left: none;
}

nav a .number {
  font-size: 13px;
  color: hsla(0, 0%, 45%, .99);
}

nav a .name {
  font-size: 30px;
  letter-spacing: 6px;
  text-indent: 6px;
  color: hsla(0, 0%, 87%, .99);
}

nav a .description {
  font-size: 14px;
  max-width: 30ch;
  text-align: center;
  line-height: 1.6;
  color: hsla(0, 0%, 55%, .99);
}

nav a .arrow {
  font-size: 22px;
  transition: transform .3s;
}

nav a:hover,
nav a:focus-visible {
  background-color: #222222;
  color: hsla(0, 0%, 87%, .99);
  outline: none;
}

nav a:hover .arrow,
nav a:focus-visible .arrow {
  transform: translateX(8px);
}

@media (max-width: 700px) {
  nav {
    flex-direction: column;
    overflow-y: auto;
  }

  nav a {
    border-left: none;
    border-top: 1px solid hsla(0, 0%, 67%, .25);
    padding: 40px 20px;
  }

  nav a:first-child {
    border-top: none;
  }
}
</style>
</head>
<body>
<header>
  <h1>DAWN</h1>
  <p>a flow-based language where everything is a URI</p>
</header>
<nav>
  <a href="tutorial.html">
    <span class="number">1</span>
    <span class="name">TUTORIAL</span>
    <span class="description">Learn the language, chapter by chapter</span>
    <span class="arrow">&#x2192;</span>
  </a>
  <a href="dawn_console.html">
    <span class="number">2</span>
    <span class="name">CONSOLE</span>
    <span class="description">Try Dawn in an interactive terminal</span>
    <span class="arrow">&#x2192;</span>
  </a>
  <a href="editor.html">
    <span class="number">3</span>
    <span class="name">IDE</span>
    <span class="description">Write, edit and run Dawn programs</span>
    <span class="arrow">&#x2192;</span>
  </a>
</nav>
</body>
</html>
