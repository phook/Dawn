<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Editor</title>
<style>
body { overflow: hidden; font-family: sans-serif; margin: 0; }
.column { display: flex; flex-direction: column; height: 100vh; }
.row    { display: flex; flex-direction: row; flex-grow: 1; }
.toolbar { display: flex; flex-direction: row; padding: 4px; background: #333; gap: 8px; align-items: center; }
.toolbar button, .toolbar select { height: 28px; padding: 0 12px; cursor: pointer; }
.toolbar span { color: #eee; font-size: 12px; }
.filename { color: #0f0; font-size: 12px; margin-left: 12px; }
.project { width: 320px; background: #f5f5f5; overflow: auto; }
.editor  { flex-grow: 1; background: #fff; position: relative; }
#editor { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }

/* Comprehensive fix for ACE cursor positioning - Chrome/Windows */
.ace_editor,
.ace_editor * {
    font-family: "Consolas", "Monaco", "Menlo", "Ubuntu Mono", "Droid Sans Mono", monospace !important;
    font-size: 14px !important;
    font-weight: 400 !important;
    letter-spacing: 0 !important;
    font-variant-ligatures: none !important;
    font-feature-settings: normal !important;
    text-rendering: optimizeSpeed !important;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.45 !important;
}
</style>
</head>
<body>
<div class="column">
<div class="toolbar">
<select id="flavorSelect">
<option value="BasicPretty">BASIC: Pretty</option>
<option value="BasicKeyboard">BASIC: Keyboard</option>
<option value="Pure">DAWN: Pure</option>
</select>
<button id="newBtn">New</button>
<button id="saveBtn">Save</button>
<span id="filename" class="filename">No file open</span>
</div>
<div class="row">
<div class="project">
<div id="project">
<em>Loading project</em>
</div>
</div>
<div class="editor">
<div id=editor class=ace_target>
</div>
</div>

<script src="ace/src-min-noconflict/ace.js"></script>
<script src="dawn.js"></script>
<script>
// Patch ACE FontMetrics to fix ≔ (U+2254 COLON EQUALS) cursor positioning
// Wait for ace to be fully loaded
function patchFontMetrics() {
    console.log("ace.require:", typeof ace.require);
    ace.require(["ace/layer/font_metrics"], function(fm_module) {
        console.log("font_metrics module loaded:", fm_module);
        if (fm_module && fm_module.FontMetrics && fm_module.FontMetrics.prototype) {
            var proto = fm_module.FontMetrics.prototype;
            var origGetCharWidth = proto.getCharacterWidth;
            proto.getCharacterWidth = function(ch) {
                console.log("PROTOTYPE getCharacterWidth called for:", ch, ch.charCodeAt(0));
                if (ch === "\u2254") return 1.0;
                return origGetCharWidth.call(this, ch);
            };
            console.log("Patched FontMetrics.prototype for ≔ (U+2254)");
        }
    });
    
    // Also check if we can directly access the module via ace.require without callback
    try {
        var fm = ace.require("ace/layer/font_metrics");
        console.log("Sync require result:", fm);
    } catch(e) {
        console.log("Sync require failed:", e);
    }
}

if (ace && ace.require) {
    patchFontMetrics();
} else {
    // ace not ready yet, wait for it
    var checkAce = setInterval(function() {
        if (window.ace && window.ace.require) {
            clearInterval(checkAce);
            patchFontMetrics();
        }
    }, 10);
}
// Also monkey-patch ace.require to see what's being loaded
var origRequire = ace.require;
ace.require = function(deps, callback) {
    console.log("ace.require called with:", deps);
    return origRequire.apply(this, arguments);
};
</script>
<script>
let environment = Dawn.require("/environment.json");
let BNFT = null;
let basicFlavor = null;
let basicParser = null;
let dawnCompiler = null;
let currentFilePath = null;
let currentFlavor = "BasicPretty";
let lastFlavor = null;
let syntaxOK = false;

(async () => {
    try {
        await Dawn.initialize(environment.dawnPath);
        let sourceDir = await Dawn.instanciate_processor().lookup(environment.userPath);
        console.log("sourceDir children:", sourceDir && sourceDir.get_resource && sourceDir.get_resource().children);
        BNFT = Dawn.require("../BNFT/BNFT.js");
        basicFlavor = Dawn.require("Flavors/basic.bnft");
        basicParser = new BNFT(basicFlavor, { fileToString: fileToString });
        dawnCompiler = new (Dawn.require("DawnCompiler.dawn.js"));
    } catch (e) {
        console.log("init error", e && e.message);
    }
})();

function fileToString(file) {
    return Dawn.require("Flavors/" + file);
}

function Do(method, url, json, callback) {
    if (typeof(json) === "function") { callback = json; json = ""; }
    else if (typeof(json) === "object") { json = JSON.stringify(json); }
    else if (typeof(json) === "undefined") { json = ""; }
    var http = new XMLHttpRequest();
    http.open(method, url, true);
    http.setRequestHeader("Content-type", "application/json");
    http.onreadystatechange = function() {
        if (http.readyState == 4 && http.status == 200) {
            callback(http.responseText);
        }
    };
    http.send(json);
}
function GET(url, json, callback)    { Do("GET", url, json, callback); return "ok"; }
function POST(url, json, callback)   { Do("POST", url, json, callback); return "ok"; }
function PUT(url, json, callback)    { Do("PUT", url, json, callback); return "ok"; }
function DELETE(url, json, callback) { Do("DELETE", url, json, callback); return "ok"; }

var editElement = document.getElementById("editor");
var editor = null;
if (editElement) {
    try { 
        editor = ace.edit(editElement); 
        console.log("Editor created:", editor);
        console.log("Renderer:", editor?.renderer);
        console.log("TextLayer:", editor?.renderer?.$textLayer);
        console.log("FontMetrics:", editor?.renderer?.$textLayer?.$fontMetrics);
        console.log("CursorLayer:", editor?.renderer?.$cursorLayer);
        
        editor.setTheme("ace/theme/dawn");
        editor.getSession().setMode("ace/mode/javascript");
        editor.setFontSize(14);
        
        // Enable variable character width support AND re-trigger font metrics setup
        editor.session.$enableVarChar = true;
        
        // Re-call $setFontMetrics to install the variable-width getStringScreenWidth
        if (editor.renderer && editor.renderer.$fontMetrics) {
            editor.session.$setFontMetrics(editor.renderer.$fontMetrics);
            console.log("Re-triggered session.$setFontMetrics with $enableVarChar=true");
        }
        
        // Patch FontMetrics instance for ≔
        setTimeout(function() {
            if (editor && editor.renderer && editor.renderer.$textLayer && editor.renderer.$textLayer.$fontMetrics) {
                var fm = editor.renderer.$textLayer.$fontMetrics;
                
                // First, measure the actual width of ≔
                var colonEqualsWidth = fm.$measureCharWidth("\u2254");
                var avgWidth = fm.$characterSize.width;
                var actualRatio = colonEqualsWidth / avgWidth;
                console.log("≔ actual width:", colonEqualsWidth, "avg:", avgWidth, "ratio:", actualRatio);
                
                var orig = fm.getCharacterWidth;
                fm.getCharacterWidth = function(ch) {
                    var result = orig.call(this, ch);
                    console.log("FontMetrics.getCharacterWidth:", ch, ch.charCodeAt(0), "->", result);
                    if (ch === "\u2254") return actualRatio;
                    return result;
                };
                console.log("Patched editor FontMetrics instance for ≔ with actual ratio:", actualRatio);
            } else {
                console.log("Could not find FontMetrics instance:", editor?.renderer?.$textLayer?.$fontMetrics);
            }
        }, 100);
        
// Patch Cursor.prototype.getPixelPosition to use actual pixel widths
        setTimeout(function() {
            if (editor && editor.renderer && editor.renderer.$cursorLayer) {
                var cursorLayer = editor.renderer.$cursorLayer;
                console.log("CursorLayer found, original getPixelPosition:", cursorLayer.getPixelPosition);
                var origGetPixelPos = cursorLayer.getPixelPosition;
                cursorLayer.getPixelPosition = function(position, onScreen) {
                    console.log(">>> PATCHED getPixelPosition CALLED");
                    if (!this.config || !this.session)
                        return { left: 0, top: 0 };
                    if (!position)
                        position = this.session.selection.getCursor();
                    var pos = this.session.documentToScreenPosition(position);
                    console.log("docToScreen pos:", pos, "position:", position);
                    
                    // Get the actual pixel width of the text up to the cursor position
                    var line = this.session.getLine(pos.row);
                    var textBeforeCursor = line.substring(0, pos.column);
                    console.log("textBeforeCursor:", textBeforeCursor);
                    var screenWidth = this.session.$getStringScreenWidth(textBeforeCursor)[0];
                    console.log("screenWidth (char units):", screenWidth, "config.characterWidth:", this.config.characterWidth);
                    
                    // The issue: screenWidth is in "character units" (ratio to avg char width)
                    // But config.characterWidth is the average char width in pixels
                    // So screenWidth * config.characterWidth should give pixels
                    // But if FontMetrics.getCharacterWidth returns wrong ratios, this is off
                    
                    var cursorLeft = this.$padding + screenWidth * this.config.characterWidth;
                    console.log("cursorLeft:", cursorLeft);
                    
                    var cursorTop = (pos.row - (onScreen ? this.config.firstRowScreen : 0)) *
                        this.config.lineHeight;
                    return { left: cursorLeft, top: cursorTop };
                };
                console.log("Patched Cursor.getPixelPosition for ≔, new:", cursorLayer.getPixelPosition);
            } else {
                console.log("Could not find CursorLayer:", editor?.renderer?.$cursorLayer);
            }
        }, 100);
        
        console.log("ACE editor initialized");
    } catch (e) { console.log("ACE init error", e); }
}

function buildFetchUrl(url) {
    if (url && url.indexOf("file:///") === 0) return "/file:///" + url.substring(8);
    if (url && url.indexOf("file:/") === 0) return "/" + url;
    return url;
}

function makeEl(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) {
        for (var k in attrs) {
            if (k === "className") el.className = attrs[k];
            else if (k === "text") el.textContent = attrs.text;
            else el.setAttribute(k, attrs[k]);
        }
    }
    if (children) {
        for (var i = 0; i < children.length; i++) {
            if (children[i]) el.appendChild(children[i]);
        }
    }
    return el;
}

function selectFile(path, el) {
    if (!path || !editor) return;
    document.querySelectorAll("li.selected").forEach(x => x.classList.remove("selected"));
    if (el) el.classList.add("selected");
	loadFile(path);
}

function loadFile(path) {
    currentFilePath = path;
    updateFilename(path.split("/").pop());
    GET(buildFetchUrl(path), function(data) {
        var source = data || "";
        if (currentFlavor !== "Pure" && BNFT && basicParser) {
			var converted = basicParser.parse(data + "\n", { nonterminal: currentFlavor == "BasicPretty" ? "FROMDAWN_PROGRAM" : "FROMDAWN_PROGRAM_KEYBOARD_COMMANDPROMPT", alert: function() {} });
			if (converted && converted.indexOf("ERROR") !== 0) 
				source = converted;
        }
        editor.setValue(source, -1);
        editor.getSession().getUndoManager().reset();
        checkSyntax();
    });
}

function newFile() {
    currentFilePath = null;
    updateFilename();
    editor.setValue("", -1);
    editor.getSession().getUndoManager().reset();
    currentFlavor = document.getElementById("flavorSelect").value;
    document.getElementById("filename").style.color = "#0f0";
    document.querySelectorAll("li.selected").forEach(x => x.classList.remove("selected"));
}

function updateFilename(name) {
    var el = document.getElementById("filename");
    if (currentFilePath) {
        el.textContent = name || currentFilePath.split("/").pop();
    } else {
        el.textContent = "[unnamed]";
    }
}

function saveFile() {
    var content = editor.getValue();
    var flavor = currentFlavor || document.getElementById("flavorSelect").value;
    if (!currentFilePath) {
        var name = prompt("File name:", "untitled.dawn");
        if (!name) return;
        currentFilePath = "file:///" + name;
        updateFilename(name);
    }
    if (flavor !== "TODAWN_PROGRAM" && BNFT && basicParser) {
        try {
            var toParse = content;
            if (!toParse.endsWith("\n")) toParse += "\n";
            var dawnSource = basicParser.parse(toParse, { nonterminal: "TODAWN_PROGRAM", alert: function() {} });
            if (dawnSource && dawnSource.indexOf("ERROR") !== 0) content = dawnSource.trimEnd();
        } catch (e) {}
    }
    var http = new XMLHttpRequest();
    http.open("PUT", "/_file?path=" + currentFilePath, true);
    http.onreadystatechange = function() {
        if (http.readyState == 4 && http.status == 200) console.log("Saved:", currentFilePath);
    };
    http.send(content);
}

document.getElementById("newBtn").addEventListener("click", newFile);
document.getElementById("saveBtn").addEventListener("click", saveFile);

document.getElementById("flavorSelect").addEventListener("change", function() {
	if (!editor || !BNFT || !basicParser) return;
	var editText = editor.getValue();
    var newFlavor = document.getElementById("flavorSelect").value;
	var flavorChanged = (currentFlavor != newFlavor)
	lastFlavor = currentFlavor;
    currentFlavor = newFlavor;

	var toParse = editText;
	if (!toParse.endsWith("\n")) toParse += "\n";
	
	var newCode = "";
	
	if (lastFlavor === "Pure")
	{
		newCode = basicParser.parse(toParse, { nonterminal: "FROMDAWN_PROGRAM", alert: function() {} });
		if (newCode.indexOf("ERROR") !== 0)
			editor.setValue(newCode);
	}
	else
	if (lastFlavor === "BasicPretty")
	{
		newCode = basicParser.parse(toParse, { nonterminal: "TODAWN_PROGRAM", alert: function() {} });
		if (newCode.indexOf("ERROR") !== 0)
			editor.setValue(newCode);
	}
    document.getElementById("filename").style.color = "#0f0";

    checkSyntax();
});

var syntaxTimer = null;

function checkSyntax() {
    var content = editor.getValue();
    if (!content.endsWith("\n")) content += "\n";
	
	if (currentFlavor == "Pure")
	{
		let result = dawnCompiler.parse(content);
		syntaxOK = result.indexOf("ERROR") !== 0;
	}
	else
	{
		let result =  basicParser.parse(content, { nonterminal: currentFlavor == "BasicPretty" ? "TODAWN_PROGRAM" : "TODAWN_PROGRAM_KEYBOARD_COMMANDPROMPT", alert: function() {} });
		syntaxOK = result.indexOf("ERROR") !== 0;
	}
	document.getElementById("flavorSelect").disabled = !syntaxOK; // dont allow syntax change with errorneous source
	document.getElementById("filename").style.color = syntaxOK ? "#0f0" : "#f44"; // color bar to alert user
}


editor.getSession().on("change", function() {
    clearTimeout(syntaxTimer);
    syntaxTimer = setTimeout(checkSyntax, 500);
});

function renderTree(parentEl, tree, level, parentUrl) {
    var ul = makeEl("ul");
    parentEl.appendChild(ul);
    Object.keys(tree).sort().forEach(function(name) {
        var entry = tree[name];
        var indent = makeEl("span", { className: "indent", style: "display:inline-block;width:" + (level * 12) + "px" });
        var row = makeEl("li");
        var label = makeEl("span", { text: "  " + name, style: "margin-left:4px" });
        if (entry && entry.contentType === "text/directory-json") {
            var childUrl = parentUrl ? (parentUrl + "/" + name) : "";
            var caret = makeEl("span", { className: "caret right", style: "margin-right:4px" });
            caret.addEventListener("click", function(ev) {
                ev.stopPropagation();
                var nestedUl = row.nextSibling;
                if (!nestedUl) return;
                var open = nestedUl.classList.toggle("open");
                caret.classList.toggle("right");
                caret.classList.toggle("down");
                if (open && nestedUl.children.length === 0 && childUrl) {
                    GET(buildFetchUrl(childUrl), function(data) {
                        try {
                            var parsed = JSON.parse(data);
                            renderTree(nestedUl, parsed, level + 1, childUrl);
                        } catch (e) { console.log("parse error", e); }
                    });
                }
            });
            row.appendChild(makeEl("span", null, [indent, caret, label]));
            ul.appendChild(row);
            var nestedUl = makeEl("ul", { className: "nested", "data-url": childUrl, "data-level": level.toString() });
            ul.appendChild(nestedUl);
        } else {
            var childUrl = parentUrl ? (parentUrl + "/" + name) : "";
            row.appendChild(makeEl("span", null, [indent, makeEl("span", { style: "display:inline-block;width:12px" }), label]));
            row.addEventListener("click", function(ev) { 
                ev.stopPropagation(); 
                selectFile(childUrl, row); 
            });
            ul.appendChild(row);
        }
    });
}

GET(buildFetchUrl(environment.dawnPath), function(data) {
    var project = document.getElementById("project");
    project.innerHTML = "";
    try {
        var parsed = JSON.parse(data);
        renderTree(project, parsed, 0, environment.dawnPath);
    } catch (e) {
        project.textContent = "Parse error: " + (e.message || e);
    }
});
</script>
</body>
</html>
