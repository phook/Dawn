<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<title>Editor</title>
<link rel="stylesheet" href="editor-theme.css">
<style>
/* === Layout only — all colors/icons/fonts live in editor-theme.css so a skin
   is just a replacement theme file === */
html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; margin: 0; }
.mainrow { display: flex; flex-direction: row; flex-grow: 1; min-height: 0; }
.workspace { display: flex; flex-direction: column; flex-grow: 1; min-width: 0; }
.toolbar { display: flex; flex-direction: row; padding: 4px; gap: 8px; align-items: center; flex: none; }
.toolbar button, .toolbar select { height: 28px; padding: 0 16px; border-radius: 25px; cursor: pointer; }
.tabbar { display: flex; overflow-x: auto; min-height: 26px; flex: none; }
.tab { padding: 4px 8px 4px 10px; display: flex; align-items: center; gap: 6px; white-space: nowrap; user-select: none; cursor: pointer; border-radius: 25px 25px 0 0; }
.project { width: 320px; overflow: auto; flex: none; border-radius: 25px; margin: 6px; }
#project { padding: 8px; }
/* flavor switcher: the console's pill dropdown, fixed in the upper right
   corner (colors/fonts live in editor-theme.css). #flavorSelect stays in the
   DOM as the hidden state-holder — the change pipeline (snapback, conversion,
   verification) runs on it and the dropdown is its visible face. */
#flavorSelect { display: none; }
.dropdown { position: fixed; top: 4px; right: 8px; width: 240px; z-index: 50; }
.dropdown-option { max-height: 15px; padding: 6px 10px 6px 25px; line-height: 15px; white-space: nowrap; transition: opacity 1s, max-height 0.3s ease; }
.dropdown-option.hide { padding: 0 10px 0 0; width: 170px; max-height: 0; }
.ontop { position: absolute; top: 6px; right: 10px; pointer-events: none; transition: top 0.3s, opacity 0.3s ease; }
.ontop.hide { opacity: 0; top: 26px; }
.dropdown.disabled { pointer-events: none; }
.editor  { flex-grow: 1; position: relative; min-height: 0; }
#editor { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
.caret { display: inline-block; width: 12px; cursor: pointer; user-select: none; margin-left: 4px; }
.caret.right::before { content: "▸"; }
.caret.down::before  { content: "▾"; }
#project ul { list-style: none; margin: 0; padding: 0; }
#project ul.nested { display: none; }
#project ul.nested.open { display: block; }
#project li { padding: 1px 4px; white-space: nowrap; }
.icon { display: inline-block; width: 14px; height: 14px; margin: 0 4px 0 2px; vertical-align: -2px; background-size: contain; background-repeat: no-repeat; background-position: center; }
.icon-tree-spacer { display: inline-block; width: 20px; }

/* Comprehensive fix for ACE cursor positioning - Chrome/Windows */
.ace_editor,
.ace_editor * {
    font-family: "Consolas", "Monaco", "Menlo", "Ubuntu Mono", "Droid Sans Mono", monospace !important;
    font-size: 14px !important;
    font-weight: 400 !important;
    letter-spacing: 0 !important;
    font-variant-ligatures: none !important;
    font-feature-settings: normal !important;
    text-rendering: optimizeSpeed !important;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.45 !important;
}
</style>
</head>

<script>
// Patch ACE FontMetrics to fix ≔ (U+2254 COLON EQUALS) cursor positioning
// Wait for ace to be fully loaded
function patchFontMetrics() {
    console.log("ace.require:", typeof ace.require);
    ace.require(["ace/layer/font_metrics"], function(fm_module) {
        console.log("font_metrics module loaded:", fm_module);
        if (fm_module && fm_module.FontMetrics && fm_module.FontMetrics.prototype) {
            var proto = fm_module.FontMetrics.prototype;
            var origGetCharWidth = proto.getCharacterWidth;
            proto.getCharacterWidth = function(ch) {
                if (ch === "\u2254") return 1.0;
                return origGetCharWidth.call(this, ch);
            };
        }
    });
    
    // Also check if we can directly access the module via ace.require without callback
    try {
        var fm = ace.require("ace/layer/font_metrics");
        console.log("Sync require result:", fm);
    } catch(e) {
        console.log("Sync require failed:", e);
    }
}

if (ace && ace.require) {
    patchFontMetrics();
} else {
    // ace not ready yet, wait for it
    var checkAce = setInterval(function() {
        if (window.ace && window.ace.require) {
            clearInterval(checkAce);
            patchFontMetrics();
        }
    }, 10);
}
// Also monkey-patch ace.require to see what's being loaded
var origRequire = ace.require;
ace.require = function(deps, callback) {
    console.log("ace.require called with:", deps);
    return origRequire.apply(this, arguments);
};
</script>

    document.getElementById("project").innerHTML =
        "<em style='color:#b00'>The editor needs the Dawn server.<br><br>" +
        "Run <code>npm run dawn</code>, then open<br>" +
        "<a href='http://localhost:3000/editor.html'>http://localhost:3000/editor.html</a></em>";
    throw new Error("editor opened via file:// — use the Dawn server (http://localhost:3000/editor.html)");
}
let environment = Dawn.require("/environment.json");
let BNFT = null;
let basicFlavor = null;
let basicParser = null;
let metaStripper = null;
let dawnCompiler = null;

(async () => {
    try {
        await Dawn.initialize(environment.dawnPath);
        let sourceDir = await Dawn.instanciate_processor().lookup(environment.userPath);
        console.log("sourceDir children:", sourceDir && sourceDir.get_resource && sourceDir.get_resource().children);
        BNFT = Dawn.require("../BNFT/BNFT.js");
        basicFlavor = Dawn.require("Flavors/basic.bnft");
        basicParser = new BNFT(basicFlavor, { fileToString: fileToString });
        metaStripper = new BNFT(Dawn.require("Flavors/removeMeta.bnft"), { fileToString: fileToString });
        dawnCompiler = new (Dawn.require("DawnCompiler.dawn.js"));
    } catch (e) {
        console.log("init error", e && e.message);
    }
})();

function fileToString(file) {
    return Dawn.require("Flavors/" + file);
}

function Do(method, url, json, callback) {
    if (typeof(json) === "function") { callback = json; json = ""; }
    else if (typeof(json) === "object") { json = JSON.stringify(json); }
    else if (typeof(json) === "undefined") { json = ""; }
    var http = new XMLHttpRequest();
    http.open(method, url, true);
    http.setRequestHeader("Content-type", "application/json");
    http.onreadystatechange = function() {
        if (http.readyState == 4 && http.status == 200) {
            callback(http.responseText);
        }
    };
    http.send(json);
}
function GET(url, json, callback)    { Do("GET", url, json, callback); return "ok"; }
function POST(url, json, callback)   { Do("POST", url, json, callback); return "ok"; }
function PUT(url, json, callback)    { Do("PUT", url, json, callback); return "ok"; }
function DELETE(url, json, callback) { Do("DELETE", url, json, callback); return "ok"; }

        editor.setFontSize(14);

                var orig = fm.getCharacterWidth;
                fm.getCharacterWidth = function(ch) {

                    return orig.call(this, ch);

// ---------- Tabs ----------
// Each tab owns its file path, flavor, syntax state and ACE session, so the
// verification logic (flavor switch, save, color) always works on the active tab.
var tabbar = document.getElementById("tabbar");
var tabs = [];
var activeTab = null;
var tabSeq = 0;
var idleSession = editor ? editor.getSession() : null; // shown when no tab is open

function makeTabSession() {
    var session = ace.createEditSession("", "ace/mode/javascript");
    session.setOptions({ tabSize: 2, useSoftTabs: true });
    session.$enableVarChar = true;
    if (editor.renderer && editor.renderer.$fontMetrics) session.$setFontMetrics(editor.renderer.$fontMetrics);
    session.on("change", function() {
        var tab = tabForSession(session);
        if (tab === activeTab) {
            clearTimeout(syntaxTimer);
            syntaxTimer = setTimeout(checkSyntax, 500); // checkSyntax also recomputes dirty
        }
    });
    return session;
}

function tabForSession(session) {
    for (var i = 0; i < tabs.length; i++) if (tabs[i].session === session) return tabs[i];
    return null;
}

// binary image files are opaque in the editor: no flavor conversion, no dirty
// tracking, no saving — the text pane shows a placeholder instead. (Their
// bytes are not UTF-8; running them through the flavor machinery produced
// lossy mojibake tabs flagged error+dirty.)
function isBinaryPath(path) {
    return /\.(png|jpe?g|gif|webp|svg|ico|bmp|avif)$/i.test(path || "");
}

function createTab(path, flavor) {
    var tab = {
        id: ++tabSeq,
        path: path || null,
        flavor: flavor || document.getElementById("flavorSelect").value || "BasicPretty",
        binary: isBinaryPath(path || ""),
        syntaxOK: true,
        dirty: false,
        session: makeTabSession(),
        el: null,
        labelEl: null
    };
    tab.el = makeEl("div", { className: "tab" });
    tab.labelEl = makeEl("span", { className: "tablabel" });
    var closeEl = makeEl("span", { className: "tabclose", text: "✕", title: "Close tab" });
    closeEl.addEventListener("click", function(ev) { ev.stopPropagation(); closeTab(tab); });
    tab.el.appendChild(tab.labelEl);
    tab.el.appendChild(closeEl);
    tab.el.addEventListener("click", function() { switchToTab(tab); });
    tab.el.addEventListener("auxclick", function(ev) { if (ev.button === 1) closeTab(tab); }); // middle-click closes
    tabs.push(tab);
    tabbar.appendChild(tab.el);
    renderTab(tab);
    return tab;
}

function tabName(tab) {
    return tab.path ? tab.path.split("/").pop() : "[unnamed]";
}

// Dirty = the saveable output (buffer converted from its flavor back to
// canonical dawn) differs from the loaded file. Flavor switching alone never
// dirties a tab: pure and basic are just editing methods of the same content.
// Blank lines and trailing whitespace are formatting, not content: dawn is
// line-oriented and native payloads are percent-encoded, so a literal blank
// line between statements carries no meaning and must not dirty a tab.
// Payloads compare by their DECODED javascript: the define/native block form
// cannot carry a payload's trailing newline (the block re-encodes without it),
// so that loss is formatting noise too — every encoded payload ends up
// without its final %0A and must not dirty the tab.
function canonEqual(a, b) {
    const decodePayloads = (s) => s.replace(
        /(\[?\s*Native\.Javascript:)([^\]]*)(\]?\s*>>\s*NewResource\S*)/g,
        (m, head, enc, tail) => {
            try { return head + decodeURIComponent(enc).replace(/\s+$/, "") + tail; } catch (e) { return m; }
        });
    const norm = (s) => decodePayloads(s).split("\n").filter(l => l.trim() !== "").join("\n").replace(/\s+$/, "");
    return norm(a) === norm(b);
}

function computeDirty(tab) {
    if (tab.binary) return false; // binary files are opaque — never dirty
    var text = tab.session.getValue();
    if (!tab.path) return /[^\s]/.test(text); // untitled: dirty while it's not empty
    if (tab.canonical == null) return false;
    if (!text.endsWith("\n")) text += "\n";
    var dawnSource = convertFromFlavor(text, tab.flavor);
    if (dawnSource === "" || dawnSource.indexOf("ERROR") === 0)
        return !canonEqual(tab.session.getValue(), tab.canonical); // broken buffer: raw fallback
    return !canonEqual(dawnSource, tab.canonical);
}

function renderTab(tab) {
    tab.labelEl.textContent = tabName(tab);
    tab.el.title = tab.path || "unsaved";
    tab.el.classList.toggle("active", tab === activeTab);
    tab.el.classList.toggle("error", !tab.syntaxOK);
    tab.el.classList.toggle("dirty", tab.dirty);
}

function renderTabs() {
    for (var i = 0; i < tabs.length; i++) renderTab(tabs[i]);
}

// One red tab anywhere suspends flavor switching globally — a broken buffer
// must never be converted, and keeping flavors frozen until all tabs are green
// again is the simplest guarantee.
function anyRedTab() {
    for (var i = 0; i < tabs.length; i++) if (!tabs[i].syntaxOK) return true;
    return false;
}

// Applies the tabs' verification state to the shared UI: flavor selector
// value/enabled, save button, tree highlight. Colors live on the tab names.
function applyTabState() {
    var flavorSelect = document.getElementById("flavorSelect");
    var saveBtn = document.getElementById("saveBtn");
    if (!activeTab) {
        flavorSelect.disabled = true;
        saveBtn.disabled = true;
        updateTreeSelection();
        syncDropdown();
        return;
    }
    flavorSelect.value = activeTab.flavor;
    flavorSelect.disabled = anyRedTab();          // switching suspended while any tab is red
    saveBtn.disabled = !activeTab.syntaxOK || activeTab.binary; // binary files are not saveable as text
    updateTreeSelection();
    syncDropdown();
}

function switchToTab(tab) {
    if (!editor || activeTab === tab) return;
    clearTimeout(syntaxTimer);
    activeTab = tab;
    if (tab) editor.setSession(tab.session);
    else if (idleSession) editor.setSession(idleSession);
    applyTabState();
    renderTabs();
}

function closeTab(tab) {
    if (tab.dirty && !confirm("Close '" + tabName(tab) + "' without saving?")) return;
    var idx = tabs.indexOf(tab);
    if (idx === -1) return;
    tabs.splice(idx, 1);
    tabbar.removeChild(tab.el);
    if (activeTab === tab) {
        var next = tabs[idx] || tabs[idx - 1] || null;
        activeTab = null;
        switchToTab(next);
    }
    applyTabState();
    renderTabs();
}

function openPath(path) {
    if (!path || !editor) return;
    for (var i = 0; i < tabs.length; i++) {
        if (tabs[i].path === path) { switchToTab(tabs[i]); return; }
    }
    var tab = createTab(path);
    switchToTab(tab);
    GET(buildFetchUrl(path), function(data) {
        if (tabs.indexOf(tab) === -1) return; // closed while loading
        var source = data || "";
        if (tab.binary) {
            // opaque: show a placeholder, never convert/flag/save the bytes
            tab.canonical = source;
            tab.session.setValue("[binary image — not shown as text]", -1);
            tab.session.getUndoManager().reset();
            tab.dirty = false;
            renderTab(tab);
            if (tab === activeTab) checkSyntax();
            return;
        }
        tab.canonical = source; // pristine file content — the dirty baseline
        source = convertToFlavor(source, tab.flavor);
        tab.session.setValue(source, -1);
        tab.session.getUndoManager().reset();
        tab.dirty = false;
        renderTab(tab);
        if (tab === activeTab) checkSyntax();
    });
}

function updateTreeSelection() {
    document.querySelectorAll("#project li.selected").forEach(x => x.classList.remove("selected"));
    if (!activeTab || !activeTab.path) return;
    var li = document.querySelector('#project li[data-path="' + CSS.escape(activeTab.path) + '"]');
    if (li) li.classList.add("selected");
}

function buildFetchUrl(url) {
    if (url && url.indexOf("file:///") === 0) return "/file:///" + url.substring(8);
    if (url && url.indexOf("file:/") === 0) return "/" + url;
    return url;
}

// Canonical docs: doc-bearing .dawn sources get the native block decoded for
// display (docs lines become #doc comments; everything else goes through the
// flavor grammar).
function convertToFlavor(text, flavor) {
	if (flavor === "Pure") return text;
	if (basicParser) {
		let parsed = basicParser.parse(text + "\n", { nonterminal: "FROMDAWN_PROGRAM", alert: function() {} });
		if (parsed && parsed.indexOf("ERROR") !== 0) return parsed;
	}
	let out = [];
	for (const line of text.split("\n")) {
		if (line.startsWith("Meta.documentation:")) { out.push("#doc " + line.substring("Meta.documentation:".length)); continue; }
		const m = line.match(/^\[?\s*Native\.Javascript:([^\]]*)\]?\s*>>\s*NewResource:(\S+)\s*$/);
		if (m) { out.push("define " + m[2]); out.push(" native javascript"); out.push(decodeURIComponent(m[1])); out.push(" endnative"); continue; }
		const m2 = line.match(/^\[?\s*Native\.Javascript:([^\]]*)\]?\s*$/);
		if (m2) { out.push(" native javascript"); out.push(decodeURIComponent(m2[1])); out.push(" endnative"); continue; }
		out.push(line);
	}
	return out.join("\n");
}

// reverse of convertToFlavor: #doc lines and define/native javascript blocks
// back into canonical [Native.Javascript:…]>>NewResource: form.
function convertFromFlavor(text, flavor) {
	if (flavor === "Pure") return text;
	if (basicParser) {
		let parsed = basicParser.parse(text + "\n", { nonterminal: "TODAWN_PROGRAM", alert: function(errorText) {console.log(errorText);} });
		if (parsed && parsed.indexOf("ERROR") !== 0) return parsed;
	}
    return [].join("\n");

}

function makeEl(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) {
        for (var k in attrs) {
            if (k === "className") el.className = attrs[k];
            else if (k === "text") el.textContent = attrs.text;
            else el.setAttribute(k, attrs[k]);
        }
    }
    if (children) {
        for (var i = 0; i < children.length; i++) {
            if (children[i]) el.appendChild(children[i]);
        }
    }
    return el;
}

function selectFile(path, el) {
    if (!path || !editor) return;
	openPath(path);
}

function newFile() {
    if (!editor) return;
    switchToTab(createTab(null, document.getElementById("flavorSelect").value));
}

// Meta statements (documentation, comments) are stripped before the compile
// check — removeMeta.bnft transforms them away; the full source, metas
// included, is what gets saved.
// Note: the BNFT strip is O(n^2) on large sources — skip it entirely when no
// Meta markers are present (the common case for plain-flow files).
function compileCheckSource(source) {
    if (!metaStripper) return source;
    if (source.indexOf("Meta.") === -1 && source.indexOf("Meta:") === -1) return source;
    var stripped = metaStripper.parse(source, { alert: function() {} });
    if (stripped && stripped.indexOf("ERROR") !== 0) return stripped;
    return source;
}

function saveFile() {
    if (!activeTab || activeTab.binary) return; // binary files are opaque — never written from the text pane
    var tab = activeTab;
    var content = tab.session.getValue();
	var dawnSource="";
    var flavor = tab.flavor;
    console.log("DEBUG saveFile: flavor=", flavor, "path=", tab.path, "content length=", content.length);
    if (!tab.path) {
        var name = prompt("File name:", "untitled.dawn");
        if (!name) return;
        tab.path = "file:///" + name;
        renderTab(tab);
        applyTabState();
    }
    if (BNFT && basicParser) {
        dawnSource = convertFromFlavor(content, flavor);
		if (!dawnSource && /[^\s]/.test(content)) {
			console.log("DEBUG: flavor conversion failed, not saving");
			return;
		}
		var codeSource = compileCheckSource(dawnSource);
		if (/[^\s]/.test(codeSource) && dawnCompiler.parse(codeSource).indexOf("ERROR") === 0) {
			console.log("DEBUG: dawn source not compiling, not saving");
			return;
		}
    } else {
        console.log("DEBUG: BNFT/flavorparser not available, not saving");
		return;
	}
    var http = new XMLHttpRequest();
    http.open("PUT", "/_file?path=" + encodeURIComponent(tab.path), true);
    http.onreadystatechange = function() {
        if (http.readyState == 4) {
            console.log("DEBUG: save response status=", http.status, "response=", http.responseText);
            if (http.status == 200) {
                console.log("Saved:", tab.path);
                // Reload the saved file to show updated content
                GET(buildFetchUrl(tab.path), function(data) {
                    if (tabs.indexOf(tab) === -1) return;
                    tab.canonical = data || "";
                    tab.session.setValue(convertToFlavor(tab.canonical, tab.flavor), -1);
                    tab.session.getUndoManager().reset();
                    tab.dirty = computeDirty(tab);
                    renderTab(tab);
                    if (tab === activeTab) checkSyntax();
                });
            }
            else console.log("Save failed:", http.status, http.responseText);
        }
    };
    http.send(dawnSource);
}

document.getElementById("newBtn").addEventListener("click", newFile);
document.getElementById("saveBtn").addEventListener("click", saveFile);

document.getElementById("flavorSelect").addEventListener("change", function() {
	if (!editor || !BNFT || !basicParser || !activeTab) return;
	var tab = activeTab;
	if (tab.binary) { tab.flavor = this.value; checkSyntax(); return; } // opaque: switch the label only
	var newFlavor = this.value; // capture now — checkSyntax/applyTabState re-syncs the select to tab.flavor

	if (anyRedTab()) { // flavor switching is suspended while any tab is red
		document.getElementById("flavorSelect").value = tab.flavor;
		return;
	}

	// evaluate syntax now, not when the debounce fires — a broken buffer must
	// never be converted, otherwise the edit would be lost in the switch
	checkSyntax();
	if (!tab.syntaxOK) {
		document.getElementById("flavorSelect").value = tab.flavor; // snap selector back
		return; // selector stays disabled until checkSyntax sees a good buffer again
	}

	var text = tab.session.getValue();
	var last = tab.flavor;
    tab.flavor = newFlavor;

	if (!text.endsWith("\n")) text += "\n";

	// canonical: convert current content out of its flavor, then into the
	// newly selected flavor — edits are never replaced by the file on disk
	var dawnSource = convertFromFlavor(text, last);
	var newCode = convertToFlavor(dawnSource, tab.flavor);
	if (dawnSource !== "" && dawnSource.indexOf("ERROR") !== 0 && newCode && newCode.indexOf("ERROR") !== 0)
	{
		tab.session.setValue(newCode, -1);
		tab.session.getUndoManager().reset();
	}
    checkSyntax();
});

// ── flavor switcher: the console's pill dropdown ─────────────────────────────
// #flavorSelect stays the state-holder (the change pipeline above handles
// snapback, conversion and verification); the dropdown mirrors it visually
// and feeds picks back as change events.
var flavorDropdown = document.getElementById("flavorDropdown");
var dropOptions = flavorDropdown.querySelectorAll(".dropdown-option");
var dropMarker = flavorDropdown.querySelector(".ontop");

function syncDropdown() {
    var select = document.getElementById("flavorSelect");
    for (var i = 0; i < dropOptions.length; i++) {
        var option = dropOptions[i];
        var active = option.dataset.value === select.value;
        option.classList.toggle("show", active);
        option.classList.toggle("hide", !active);
    }
    flavorDropdown.classList.toggle("disabled", select.disabled);
}

function shownOption() {
    var select = document.getElementById("flavorSelect");
    for (var i = 0; i < dropOptions.length; i++)
        if (dropOptions[i].dataset.value === select.value) return dropOptions[i];
    return dropOptions[0];
}

// the console's open/close choreography: a closed pill opens on any click;
// clicking an option (or anywhere outside) closes it with that option shown,
// and a genuine pick is fed to the select as a change event
function selectDropOption(element) {
    if (document.getElementById("flavorSelect").disabled) return;
    if (flavorDropdown.classList.contains("closed")) {
        flavorDropdown.classList.remove("closed");
        dropMarker.classList.add("hide");
        for (var i = 0; i < dropOptions.length; i++) dropOptions[i].classList.remove("hide");
        setTimeout(function() {
            for (var i = 0; i < dropOptions.length; i++) dropOptions[i].classList.add("show");
        }, 250);
        return;
    }
    flavorDropdown.classList.add("closed");
    dropMarker.classList.remove("hide");
    for (var i = 0; i < dropOptions.length; i++) {
        var option = dropOptions[i];
        option.classList.toggle("show", option === element);
        option.classList.toggle("hide", option !== element);
    }
    var select = document.getElementById("flavorSelect");
    if (select.value !== element.dataset.value) {
        select.value = element.dataset.value;
        select.dispatchEvent(new Event("change")); // re-syncs the dropdown via applyTabState
    }
}

for (var i = 0; i < dropOptions.length; i++) {
    dropOptions[i].addEventListener("click", function(event) {
        event.stopPropagation();
        selectDropOption(this);
    });
}

window.addEventListener("click", function(event) {
    if (!flavorDropdown.contains(event.target) && !flavorDropdown.classList.contains("closed"))
        selectDropOption(shownOption()); // outside click: close without changing flavor
});

syncDropdown();

var syntaxTimer = null;

// Verification for the active tab: the buffer must convert from its flavor to
// canonical dawn and compile. The result is stored on the tab and mirrored
// into the shared UI (selector/save state) and the tab's name color:
// red = broken, yellow = unsaved, green = saved.
function checkSyntax() {
    if (!activeTab) { applyTabState(); return; }
	var tab = activeTab;
    if (tab.binary) { // opaque: nothing to verify, nothing to save
        tab.syntaxOK = true;
        tab.dirty = false;
        applyTabState();
        renderTab(tab);
        return;
    }
    var content = tab.session.getValue();
    if (!content.endsWith("\n")) content += "\n";

	let dawnSource = convertFromFlavor(content, tab.flavor);
	tab.syntaxOK = !/[^\s]/.test(content) // an empty buffer has nothing to break
        || (dawnSource !== "" && dawnSource.indexOf("ERROR") !== 0 // flavor conversion must succeed
            && (!/[^\s]/.test(compileCheckSource(dawnSource)) // meta-stripped remainder may be empty (docs only)
                || dawnCompiler.parse(compileCheckSource(dawnSource)).indexOf("ERROR") !== 0)); // code must compile
	tab.dirty = computeDirty(tab); // saveable output vs loaded file — flavor switching alone stays green

	applyTabState(); // flavor switch + save blocked while the buffer is broken; colors updated
	renderTab(tab);
}

function renderTree(parentEl, tree, level, parentUrl) {
    var ul = makeEl("ul");
    parentEl.appendChild(ul);
    Object.keys(tree).sort().forEach(function(name) {
        var entry = tree[name];
        // an application/dawn entry "X" next to its source "X.dawn" is the loader's
        // alias — present only for resource resolution, not a file to edit. Hide it.
        if (entry && entry.contentType === "application/dawn" && tree[name + ".dawn"]) return;
        var indent = makeEl("span", { className: "indent", style: "display:inline-block;width:" + (level * 12) + "px" });
        var row = makeEl("li");
        var label = makeEl("span", { text: name, style: "margin-left:2px" });
        if (entry && entry.contentType === "text/directory-json") {
            var childUrl = parentUrl ? (parentUrl + "/" + name) : "";
            var caret = makeEl("span", { className: "caret right" });
            var icon = makeEl("span", { className: "icon icon-folder" });
            var toggleDir = function(ev) {
                ev.stopPropagation();
                var nestedUl = row.nextSibling;
                if (!nestedUl) return;
                var open = nestedUl.classList.toggle("open");
                caret.classList.toggle("right");
                caret.classList.toggle("down");
                if (open && !nestedUl.dataset.loaded && childUrl) {
                    nestedUl.dataset.loaded = "1"; // also blocks re-fetch races while the GET is in flight
                    GET(buildFetchUrl(childUrl), function(data) {
                        try {
                            var parsed = JSON.parse(data);
                            renderTree(nestedUl, parsed, level + 1, childUrl);
                        } catch (e) {
                            delete nestedUl.dataset.loaded; // allow retry
                            console.log("parse error", e);
                        }
                    });
                }
            };
            row.addEventListener("click", toggleDir);   // anywhere on the directory row opens/closes
            caret.addEventListener("click", toggleDir);
            row.style.cursor = "pointer";
            row.style.userSelect = "none";
            row.appendChild(makeEl("span", null, [indent, icon, label, caret]));
            ul.appendChild(row);
            var nestedUl = makeEl("ul", { className: "nested", "data-url": childUrl, "data-level": level.toString() });
            ul.appendChild(nestedUl);
        } else {
            var childUrl = parentUrl ? (parentUrl + "/" + name) : "";
            var fileIcon = name.endsWith(".dawn")
                ? makeEl("span", { className: "icon icon-file-dawn" })
                : makeEl("span", { className: "icon-tree-spacer" });
            row.appendChild(makeEl("span", null, [indent, fileIcon, label]));
            row.setAttribute("data-path", childUrl);
            row.addEventListener("click", function(ev) {
                ev.stopPropagation();
                selectFile(childUrl, row);
            });
            ul.appendChild(row);
        }
    });
}

GET(buildFetchUrl(environment.dawnPath), function(data) {
    var project = document.getElementById("project");
    project.innerHTML = "";
    try {
        var parsed = JSON.parse(data);
        renderTree(project, parsed, 0, environment.dawnPath);
    } catch (e) {
        project.textContent = "Parse error: " + (e.message || e);
    }
});

// start with one untitled tab
if (editor) newFile();
</script>
